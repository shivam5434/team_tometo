version = 0.1

[default.deploy.parameters]
stack_name = "air-advisor"
resolve_s3 = true
s3_prefix = "air-advisor"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
parameter_overrides = "PythonRuntime=\"python3.14\" ScheduleExpression=\"rate(3 hours)\" TtlHours=\"12\""
image_repositories = []

[default.global.parameters]
region = "us-east-1"
